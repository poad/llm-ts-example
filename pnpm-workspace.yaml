packages:
  - common/core
  - common/backend/core
  - common/backend/langchain
  - basic/cdk
  - basic/app
  - basic/cdk/function
  - rag/batch
  - rag/app
  - rag/cdk
  - rag/cdk/function
  - agents/aws-lambda/agent-ai-sdk
  - agents/aws-lambda/agent-strands
  - agents/agent-claude-agent-sdk
  - agents/agent-deepagents
  - agents/agent-langchain
  - agents/agent-langchain-nextjs
  - agents/agent-strands
  - mcp/mcp-client-http
  - mcp/servers/postgresql-http
  - mcp/servers/weather
  - mcp/servers/weather-http
  - mcp/servers/resource-mcp-server
  - chat-app

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  better-sqlite3: false
  esbuild: false
  node-liblzma: false
  node-llama-cpp: false
  protobufjs: false
  sharp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.21.0

  - '@next/bundle-analyzer@16.4.6'
  - '@next/env@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - next@16.4.6

  - '@solidjs/babel-plugin@2.0.0'
  - '@solidjs/compiler-darwin-arm64@2.0.0'
  - '@solidjs/compiler-darwin-x64@2.0.0'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0'
  - '@solidjs/compiler-wasm32-wasi@2.0.0'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0'
  - '@solidjs/compiler@2.0.0'
  - '@solidjs/web@2.0.0 || 2.0.3'
  - '@solidjs/signals@2.0.3'
  - solid-js@2.0.3
  - eslint-plugin-solid@0.20.0
  - '@solidjs/router@2.0.0'
  - '@solidjs/vite-plugin@3.0.1'
  - '@xyflow/react@13.0.0'
  - '@xyflow/system@1.0.0'

overrides:
  semver: '>=7'
  uuid@<11.1.1: ^14
  undici: ^6
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.217.0': ^0.217.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.12.1
  '@opentelemetry/sdk-node@>=0.57.0 <0.217.0': ^0.217.0
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  katex@>=0.11.0 <0.18.2: ^0.18.2
  linkify-it@<=5.0.1: ^5.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  protobufjs@<=7.6.2: ^7.6.3
  sharp@<0.35.5: ^0.35.5

permissions:
  solid-js:
    skills: [reactivity-diagnostics, solid-2.0, solid-2.0-cheatsheet]
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .github/skills
strictPeerDependencies: false

trustPolicy: no-downgrade
