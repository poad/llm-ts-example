packages:
  - ./common/core
  - ./common/backend/core
  - ./common/backend/langchain
  - ./basic/cdk
  - ./basic/app
  - ./basic/cdk/function
  - ./rag/batch
  - ./rag/app
  - ./rag/cdk
  - ./rag/cdk/function
  - ./agents/aws-lambda/agent-ai-sdk
  - ./agents/aws-lambda/agent-strands
  - ./agents/agent-claude-agent-sdk
  - ./agents/agent-deepagents
  - ./agents/agent-langchain
  - ./agents/agent-langchain-nextjs
  - ./agents/agent-strands
  - ./mcp/mcp-client-http
  - ./mcp/servers/postgresql-http
  - ./mcp/servers/weather
  - ./mcp/servers/weather-http
  - ./mcp/servers/resource-mcp-server
  - ./chat-app

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  esbuild: false
  node-liblzma: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@11.21.0

  - next@16.3.0
  - eslint-config-next@16.3.0
  - '@next/eslint-plugin-next@16.3.0'
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - '@opentelemetry/sdk-node@0.217.0'
  - '@opentelemetry/exporter-prometheus@0.217.0'
  - '@opentelemetry/core@2.8.0'
  - linkify-it@5.0.1 || 5.0.2
  - '@hono/node-server@2.0.5'
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - sharp@0.35.0
  - mermaid@11.16.1

overrides:
  eslint-import-resolver-typescript: '^4.4.5'
  protobufjs: ^7
  semver: '>=7'
  uuid@<11.1.1: ^14
  undici: ^6
  '@hono/node-server@<2.0.5': ^2.0.5
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.217.0': ^0.217.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@opentelemetry/sdk-node@<0.217.0': ^0.217.0
  linkify-it@<=5.0.0: ^5.0.1
  linkify-it@<=5.0.1: ^5.0.2
  mermaid@>=11.0.0-alpha.1 <11.16.1: ^11.16.1
  mermaid@>=11.5.0 <11.16.1: ^11.16.1
  mermaid@>=11.6.0 <11.16.1: ^11.16.1
  sharp@<0.35.0: ^0.35.0

strictPeerDependencies: false

trustPolicy: no-downgrade
