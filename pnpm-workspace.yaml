packages:
  - ./common/core
  - ./common/backend/core
  - ./common/backend/langchain
  - ./basic/cdk
  - ./basic/app
  - ./basic/cdk/function
  - ./rag/batch
  - ./rag/app
  - ./rag/cdk
  - ./rag/cdk/function
  - ./agents/agent-ai-sdk
  - ./agents/agent-claude-agent-sdk
  - ./agents/agent-deepagents
  - ./agents/agent-langchain
  - ./agents/agent-langchain-nextjs
  - ./agents/agent-strands
  - ./mcp/mcp-client-http
  - ./mcp/servers/postgresql-http
  - ./mcp/servers/weather
  - ./mcp/servers/weather-http
  - ./mcp/servers/resource-mcp-server
  - ./mcp/clients/mcp-client-typescript
  - ./chat-app

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  esbuild: false
  node-liblzma: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@11.14.0
  - postcss@8.5.10
  - linkify-it@5.0.1
  - brace-expansion@1.1.16 || 5.0.8
  - '@hono/node-server@2.0.5'
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - fast-uri@3.1.4
  - sharp@0.35.0
  - js-yaml@5.2.2

overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.217.0': ^0.217.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@opentelemetry/sdk-node@<0.217.0': ^0.217.0
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<=5.0.7: ^5.0.8
  eslint-import-resolver-typescript: '^4.4.5'
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  linkify-it@<=5.0.0: ^5.0.1
  postcss@<8.5.10: ^8.5.10
  protobufjs: ^8.6.3
  semver: '>=7'
  sharp@<0.35.0: ^0.35.0
  uuid@<11.1.1: ^14

strictPeerDependencies: false

trustPolicy: no-downgrade
