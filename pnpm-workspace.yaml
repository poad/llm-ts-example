packages:
  - common/core
  - common/backend/core
  - common/backend/langchain
  - basic/cdk
  - basic/app
  - basic/cdk/function
  - rag/batch
  - rag/app
  - rag/cdk
  - rag/cdk/function
  - agents/aws-lambda/agent-ai-sdk
  - agents/aws-lambda/agent-strands
  - agents/agent-claude-agent-sdk
  - agents/agent-deepagents
  - agents/agent-langchain
  - agents/agent-langchain-nextjs
  - agents/agent-strands
  - mcp/mcp-client-http
  - mcp/servers/postgresql-http
  - mcp/servers/weather
  - mcp/servers/weather-http
  - mcp/servers/resource-mcp-server
  - chat-app

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  better-sqlite3: false
  esbuild: false
  node-liblzma: false
  node-llama-cpp: false
  protobufjs: false
  sharp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.10.1

  - '@next/bundle-analyzer@16.4.0'
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0

overrides:
  protobufjs: ^7
  semver: '>=7'
  uuid@<11.1.1: ^14
  undici: ^6
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.222.0': ^0.222.0
  '@opentelemetry/instrumentation-cassandra-driver@<0.66.0': ^0.66.0
  '@opentelemetry/instrumentation-knex@<0.65.0': ^0.65.0
  '@opentelemetry/instrumentation-mongoose@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql2@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-mysql@<0.67.0': ^0.67.0
  '@opentelemetry/instrumentation-oracledb@<0.46.0': ^0.46.0
  '@opentelemetry/instrumentation-pg@<0.73.0': ^0.73.0
  '@opentelemetry/instrumentation-tedious@<0.40.0': ^0.40.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@opentelemetry/sdk-node@<0.222.0': ^0.222.0
  katex@>=0.11.0 <0.18.2: ^0.18.2
  linkify-it@<=5.0.1: ^5.0.2
  seroval@<=1.6.2: ^1.6.3
  sharp@<0.35.5: ^0.35.5

strictPeerDependencies: false

trustPolicy: no-downgrade
