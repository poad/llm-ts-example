packages:
  - common/core
  - common/backend/core
  - common/backend/langchain
  - basic/cdk
  - basic/app
  - basic/cdk/function
  - rag/batch
  - rag/app
  - rag/cdk
  - rag/cdk/function
  - agents/aws-lambda/agent-ai-sdk
  - agents/aws-lambda/agent-strands
  - agents/agent-claude-agent-sdk
  - agents/agent-deepagents
  - agents/agent-langchain
  - agents/agent-langchain-nextjs
  - agents/agent-strands
  - mcp/mcp-client-http
  - mcp/servers/postgresql-http
  - mcp/servers/weather
  - mcp/servers/weather-http
  - mcp/servers/resource-mcp-server
  - chat-app

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  better-sqlite3: false
  esbuild: false
  node-liblzma: false
  node-llama-cpp: false
  protobufjs: false
  sharp: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.9.0

  - '@next/bundle-analyzer@16.3.7'
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - next@16.3.7

overrides:
  eslint-import-resolver-typescript: '^4.4.5'
  protobufjs: ^7
  semver: '>=7'
  uuid@<11.1.1: ^14
  undici: ^6
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/exporter-prometheus@<0.217.0': ^0.217.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@opentelemetry/sdk-node@<0.217.0': ^0.217.0
  linkify-it@<=5.0.1: ^5.0.2
  sharp@<0.35.4: ^0.35.4

strictPeerDependencies: false

trustPolicy: no-downgrade
