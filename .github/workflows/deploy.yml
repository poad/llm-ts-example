name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main

  workflow_dispatch: null
env:
  OIDC_IAM_ROLE_ARN: ${{ secrets.OIDC_IAM_ROLE_ARN }}
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

jobs:
  deploy-basic-example:
    # 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
    concurrency:
      group: "cloudformation-llm-basic"
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1

    - name: Install pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2

    - name: Install global dependencies
      run: pnpm add -g aws-cdk esbuild

    - name: build
      run: pnpm build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env.OIDC_IAM_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ env.AWS_REGION }}

    - name: deploy
      working-directory: basic/cdk
      run: |
        pnx aws-cdk@latest deploy \
          -c oai-instance-name=${{ secrets.AZURE_OPENAI_API_INSTANCE_NAME }} \
          -c oai-api-key=${{ secrets.AZURE_OPENAI_API_KEY }} \
          -c oai-api-version=${{ vars.AZURE_OPENAI_API_VERSION }} \
          -c anthropic-api-key=${{ secrets.ANTHROPIC_API_KEY }} \
          -c claude-model=${{ vars.CLAUDE_MODEL }} \
          -c enabled-openinference-telemetry=${{ vars.ENABLED_OPENINFERENCE_TELEMETRY }} \
          -c langfuse-endpoint=${{ secrets.LANGFUSE_ENDPOINT }} \
          -c langfuse-public-key=${{ secrets.LANGFUSE_PUBLIC_KEY }} \
          -c langfuse-secret-key=${{ secrets.LANGFUSE_SECRET_KEY }} \
          -c langsmith-api-key=${{ secrets.LANGCHAIN_API_KEY }} \
          -c langsmith-project=${{ secrets.LANGCHAIN_PROJECT }} \
          -c phoenix-api-key=${{ secrets.PHOENIX_API_KEY }} \
          -c phoenix-space-id=${{ vars.PHOENIX_SPACE_ID }} \
          -c otel-traces-endpoint=${{ vars.OTEL_EXPORTER_OTLP_TRACE_ENDPOINT }}

  deploy-rag:
    # 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
    concurrency:
      group: "rag-examle-cloudformation"
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1

    - name: Install pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2

    - name: Install global dependencies
      run: pnpm add -g aws-cdk esbuild

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env.OIDC_IAM_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ env.AWS_REGION }}

    - name: deploy
      working-directory: rag/cdk
      run: |
        pnx aws-cdk@latest deploy \
          -c oai-instance-name=${{ secrets.AZURE_OPENAI_API_INSTANCE_NAME }} \
          -c oai-api-key=${{ secrets.AZURE_OPENAI_API_KEY }} \
          -c oai-api-version=${{ vars.AZURE_OPENAI_API_VERSION }} \
          -c langfuse-endpoint=${{ secrets.LANGFUSE_ENDPOINT }} \
          -c langfuse-public-key=${{ secrets.LANGFUSE_PUBLIC_KEY }} \
          -c langfuse-secret-key=${{ secrets.LANGFUSE_SECRET_KEY }} \
          -c langsmith-api-key=${{ secrets.LANGCHAIN_API_KEY }} \
          -c langsmith-project=${{ secrets.LANGCHAIN_PROJECT }} \
          -c pinecone-index=${{ vars.PINECONE_INDEX }} \
          -c pinecone-api-key=${{ secrets.PINECONE_API_KEY }}

  deploy-aisdk-api:
    # 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
    concurrency:
      group: "aisdk-api-examle-cloudformation"
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1

    - name: Install pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2

    - name: Install global dependencies
      run: pnpm add -g aws-cdk esbuild

    - name: Build (common)
      run: |
        pnpm --filter @llm-ts-example/common-core build
        pnpm --filter @llm-ts-example/common-backend-core build
        pnpm --filter @llm-ts-example/common-backend-langchain build

    - name: Debug workspace links
      run: |
        pnpm list -r --depth 0
        pnpm why @llm-ts-example/common-backend-core
        pnpm why @llm-ts-example/common-backend-langchain

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env.OIDC_IAM_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ env.AWS_REGION }}

    - name: deploy
      working-directory: agents/aws-lambda/agent-ai-sdk
      run: |
        pnx aws-cdk@latest deploy \
          --require-approval=never

  deploy-strands-agent-api:
    # 同時実行すると CREATE_IN_PROGRESS や UPDATE_IN_PROGRESS 状態で cdk deploy を行う可能性があるため抑止する
    concurrency:
      group: "strands-agent-cloudformation"
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1

    - name: Install pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2

    - name: Install global dependencies
      run: pnpm add -g aws-cdk esbuild

    - name: Build (common)
      run: |
        pnpm --filter @llm-ts-example/common-core build
        pnpm --filter @llm-ts-example/common-backend-core build
        pnpm --filter @llm-ts-example/common-backend-langchain build

    - name: Debug workspace links
      run: |
        pnpm list -r --depth 0
        pnpm why @llm-ts-example/common-backend-core
        pnpm why @llm-ts-example/common-backend-langchain

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ env.OIDC_IAM_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ env.AWS_REGION }}

    - name: deploy
      working-directory: agents/aws-lambda/agent-strands
      run: |
        pnx aws-cdk@latest deploy \
          --require-approval=never
